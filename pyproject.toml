[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "prefixserve"
version = "0.1.0"
description = "Multi-tenant LLM serving with RadixAttention and a paged KV cache"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
test = ["prefixserve[server]", "pytest>=8", "pytest-timeout>=2.3", "hypothesis>=6", "mypy>=1.10", "httpx>=0.27"]

[project.scripts]
prefixserve = "prefixserve.server:main"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["prefixserve"]
build-dir = "build/{wheel_tag}"

[tool.mypy]
# No stubs / py.typed for these.
[[tool.mypy.overrides]]
module = ["transformers.*", "flashinfer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# A scheduler bug that loops forever should fail fast, not hang CI.
timeout = 120
