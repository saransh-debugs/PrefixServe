[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "prefixserve"
version = "0.1.0"
description = "Multi-tenant LLM serving with RadixAttention and a paged KV cache"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-timeout>=2.3", "hypothesis>=6", "mypy>=1.10"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["prefixserve"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]
# A scheduler bug that loops forever should fail fast, not hang CI.
timeout = 120
